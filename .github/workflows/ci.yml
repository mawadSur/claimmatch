# CI for every pull request and every push to main.
#
# Branch protection on main requires the two jobs below by name: "verify" and
# "db-migrations". Renaming a job (its id or its name) silently drops it from
# the required checks, so update branch protection in the same change.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch or pull request. A new push to a pull request cancels its
# older run. On main a started run is never cancelled; it finishes, and the
# newest push waits its turn (GitHub keeps only the latest waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      # No Supabase, Resend or other app settings on purpose: the build must
      # pass without secrets, the way it does locally.
      - name: Build
        run: npm run build

      # Fails on any high or critical advisory in runtime dependencies except
      # the postcss ones that next 15 pins (postcss 8.4.31; only next 16 fixes
      # them). scripts/audit-gate.ts lists those by GHSA id. npm audit exits
      # non-zero whenever it finds anything, so the gate decides, and it fails
      # closed when npm could not audit at all.
      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          npx tsx scripts/audit-gate.ts "$RUNNER_TEMP/npm-audit.json"

  db-migrations:
    name: db-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The throwaway database in the service container above. Never a real
      # Supabase project: scripts/db-test.sh creates stub roles and writes rows.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # Applies every supabase/migrations file from scratch, then
      # supabase/tests (including RLS probes). Merge code that needs those
      # columns or functions only after the matching migration has been
      # applied on the target database.
      - name: Apply every migration from scratch and run the SQL tests
        run: scripts/db-test.sh
